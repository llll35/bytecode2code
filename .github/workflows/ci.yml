name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  roundtrip:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Round-trip and source fidelity
        run: python -m tests.run
        timeout-minutes: 10

  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cross-version regression suite
        run: python main.py selftest
        # The suite compiles a corpus with every interpreter under
        # embed_python/, which is slow.
        timeout-minutes: 30
